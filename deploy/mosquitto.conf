# ncrypt.org — Mosquitto broker config (deploy/mosquitto.conf).
#
# Transient broker: the history service (backend/server.js) is the durable
# store, so persistence is off. Caddy proxies wss://ncrypt.org/mqtt to this
# loopback websockets listener (9001).

# Per-client caps (flood backstop). Global settings.
# max_queued_messages: max QoS-1 messages queued per client while disconnected.
max_queued_messages 50
# max_inflight_messages: max in-flight QoS-1 messages per client.
max_inflight_messages 10
# max_burst_messages: max messages a client may publish in a short burst.
# BLOCKED: requires mosquitto >= 2.1 (server runs 2.0.18, which rejects the
# option and fails to start). Uncomment after upgrading the broker.
# max_burst_messages 20

listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
# Connection cap for this listener.
max_connections 500

# No on-disk persistence — the history service owns the store.
persistence false

log_dest stderr
